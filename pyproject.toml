[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lstms"
version = "0.1.0"
description = "Minimal Python environment scaffold with sample app and tests"
readme = "README.md"
authors = [{ name = "dark" }]
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
  "rich>=13.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
