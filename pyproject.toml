[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lstms"
version = "0.1.0"
description = "Character-level LSTM language model implemented from scratch in NumPy"
readme = "README.md"
authors = [{ name = "Baraa Rjoob" }]
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.21",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
